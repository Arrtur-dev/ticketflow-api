spring.application.name=ticketflow-api

# Banco H2 em memoria - some quando voce para a aplicacao (normal em estudo)
spring.datasource.url=jdbc:h2:mem:ticketflow
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Cria/atualiza as tabelas automaticamente a partir das classes @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console visual do banco: acesse http://localhost:8080/h2-console
spring.h2.console.enabled=true
